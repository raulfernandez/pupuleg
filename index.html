<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutina de Fuerza · PPL v2</title>
<style>
  :root{
    --bg:#16181b; --panel:#1e2126; --panel2:#23272d; --line:#343a42;
    --ink:#eceae4; --muted:#969ba3; --amber:#e6a917; --amber-soft:rgba(230,169,23,.12);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --cond:"Helvetica Neue Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  /* topbar */
  .top{position:sticky;top:0;z-index:20;background:rgba(22,24,27,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:18px;height:58px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:.02em}
  .brand b{color:var(--amber)}
  .nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .nav a{text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.08em;
    color:var(--muted);padding:7px 11px;border-radius:2px}
  .nav a:hover{color:var(--ink);background:var(--panel2)}

  /* hero */
  .hero{padding:64px 0 34px;border-bottom:1px solid var(--line)}
  .hero .kick{color:var(--amber);font-weight:800;letter-spacing:.18em;font-size:13px}
  .hero h1{font-family:var(--cond);font-weight:800;
    font-size:clamp(52px,12vw,132px);line-height:.86;margin:.18em 0 .12em;
    letter-spacing:-.01em;text-transform:uppercase}
  .hero h1 span{display:block;color:var(--amber)}
  .hero .lead{color:var(--muted);max-width:60ch;font-size:17px}
  .params{display:flex;flex-wrap:wrap;gap:0;margin-top:30px;border:1px solid var(--line)}
  .params div{flex:1 1 150px;padding:14px 18px;border-right:1px solid var(--line)}
  .params div:last-child{border-right:0}
  .params .k{color:var(--muted);font-size:12px;letter-spacing:.06em}
  .params .v{font-weight:700;margin-top:3px}
  .params .v em{color:var(--amber);font-style:normal}

  /* fase tabs */
  .fase-tabs{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
  .fase-tab{font-family:inherit;font-weight:800;letter-spacing:.04em;font-size:13px;
    text-transform:uppercase;background:var(--panel);color:var(--muted);border:1px solid var(--line);
    padding:10px 16px;border-radius:2px;cursor:pointer}
  .fase-tab:hover{color:var(--ink)}
  .fase-tab.is-active{color:#0e0f11;background:var(--amber);border-color:var(--amber)}
  .fase-resumen{color:var(--muted);font-size:14px;margin:14px 0 0;max-width:70ch}
  .fase-resumen b{color:var(--ink)}

  .bloque-select{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bloque-select .k{color:var(--muted);font-size:12px;letter-spacing:.06em}
  .bloque-tabs{display:flex;gap:6px}
  .bloque-tab{font-family:inherit;font-weight:700;font-size:12px;background:var(--panel);
    color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:2px;cursor:pointer}
  .bloque-tab small{opacity:.7;font-weight:500}
  .bloque-tab.is-active{color:#0e0f11;background:var(--amber);border-color:var(--amber)}

  /* calendario */
  .cal{padding:44px 0 8px}
  .section-h{font-family:var(--cond);text-transform:uppercase;letter-spacing:.02em;font-size:30px;margin:0 0 8px}
  .section-lead{color:var(--muted);font-size:14px;max-width:70ch;margin:0 0 18px}
  .cal-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
  .cal-table th,.cal-table td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .cal-table th{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
  .cal-table tr.is-today td{color:var(--amber);font-weight:700}
  .cal-table tr:last-child td{border-bottom:0}
  .cal-warmup{margin-top:14px}

  /* day */
  .day{padding:52px 0 8px}
  .day-h{display:flex;align-items:baseline;gap:18px;padding-bottom:20px;margin-bottom:4px;
    border-bottom:2px solid var(--amber);flex-wrap:wrap}
  .day-code{font-family:var(--cond);text-transform:uppercase;font-weight:800;
    font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-.01em}
  .day-sub{color:var(--muted);font-size:14px}
  .dia-alt{color:var(--muted);font-size:13px;margin-top:16px}

  .ppl-inactive{padding:52px 0;border-bottom:1px solid var(--line);color:var(--muted)}
  .ppl-inactive a{color:var(--amber);text-decoration:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;
    display:flex;flex-direction:column}
  .card.is-main{border-color:var(--amber)}

  .frame{position:relative;aspect-ratio:5/4;background:#0e0f11;overflow:hidden}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .frame .f1{opacity:0;animation:rep 2.8s ease-in-out infinite}
  @keyframes rep{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
  .frame .rep{position:absolute;left:10px;bottom:10px;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:#0e0f11;background:var(--amber);padding:3px 8px;
    border-radius:2px;font-weight:800;opacity:.9}
  .frame-placeholder,.pframe .ph-inner{display:flex;align-items:center;justify-content:center}
  .ph-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--muted);font-size:12px;text-align:center;padding:10px}
  .ph-inner a{color:var(--amber);text-decoration:none;font-weight:700}
  .ph-label{letter-spacing:.06em;text-transform:uppercase;font-size:11px}

  .body{padding:16px 17px 18px;display:flex;flex-direction:column;gap:8px}
  .body h3{margin:0;font-size:18px;line-height:1.2;font-weight:700}
  .tag{align-self:flex-start;font-size:11px;letter-spacing:.05em;color:var(--amber);
    background:var(--amber-soft);border:1px solid rgba(230,169,23,.35);padding:2px 8px;border-radius:2px}
  .presc{margin:0;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;
    background:var(--panel2);border-left:3px solid var(--amber);padding:7px 10px;border-radius:2px;font-size:14px}
  .presc.is-ajustada{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .presc-base{font-weight:500;color:var(--muted);font-size:12px;text-decoration:line-through}
  .fase-badge{font-size:10px;letter-spacing:.06em;font-weight:800;color:#0e0f11;background:var(--amber);
    padding:2px 6px;border-radius:2px}
  .cue{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
  .muted{color:var(--muted)}

  .variants{margin-top:2px;font-size:13px}
  .variants summary{cursor:pointer;color:var(--amber);font-weight:700;font-size:12px;letter-spacing:.03em}
  .variants ul{margin:8px 0 0;padding-left:18px;color:var(--ink)}
  .variants li{margin:3px 0}
  .variant-porque{color:var(--muted);margin:8px 0 0;font-size:12.5px;line-height:1.5}

  /* roadmap progresiones */
  .road{padding:6px 0 2px}
  .road.is-active-phase{background:linear-gradient(0deg,var(--amber-soft),transparent);border-radius:4px}
  .road-intro{color:var(--muted);max-width:72ch;margin:4px 0 10px;font-size:15px}
  .road-nota-fase{color:var(--muted);font-size:12.5px;font-style:italic;margin:0 0 22px}
  .ladder{display:flex;flex-direction:column;gap:14px}
  .phase{display:grid;grid-template-columns:44px 132px 1fr;gap:16px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px}
  .phase.is-goal{border-color:var(--amber);background:linear-gradient(0deg,var(--amber-soft),transparent)}
  .pnum{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;background:var(--panel2);color:var(--amber);border:1px solid var(--line);font-size:16px}
  .phase.is-goal .pnum{background:var(--amber);color:#0e0f11;border-color:var(--amber);font-size:10px;letter-spacing:.06em}
  .pframe{position:relative;aspect-ratio:5/4;background:#0e0f11;border-radius:2px;overflow:hidden}
  .pframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .pframe .f1{opacity:0;animation:rep 2.8s ease-in-out infinite}
  .pbody h4{margin:0 0 6px;font-size:16px;font-weight:700}
  .ptarget{margin:0;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;
    background:var(--panel2);border-left:3px solid var(--amber);padding:5px 9px;border-radius:2px;display:inline-block}
  .pnext{margin:8px 0 0;font-size:13px;color:var(--amber);font-weight:600}
  .pcue{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
  @media (max-width:560px){
    .phase{grid-template-columns:38px 1fr;grid-template-areas:"num body" "img img"}
    .pnum{grid-area:num} .pbody{grid-area:body}
    .pframe{grid-area:img;aspect-ratio:16/9;margin-top:4px}
  }

  /* fase 2 */
  .fase2-details{padding:24px 0}
  .fase2-summary{cursor:pointer;list-style:none}
  .fase2-summary::-webkit-details-marker{display:none}
  .f2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px}
  .f2-dia{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px}
  .f2-dia h4{margin:0 0 10px;font-family:var(--cond);text-transform:uppercase;font-size:22px}
  .f2-table{width:100%;border-collapse:collapse}
  .f2-table td{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
  .f2-table tr:last-child td{border-bottom:0}
  .f2-table td:last-child{text-align:right;color:var(--muted);white-space:nowrap;padding-left:10px}

  /* progresion / reglas */
  .prog{margin:56px 0 20px;border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:4px 0 4px}
  .prog h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.02em;
    font-size:26px;margin:0;padding:20px 22px 10px}
  .prog ul{margin:0;padding:0 22px 20px;}
  .prog li{margin:10px 0;color:var(--muted)}
  .prog li b{color:var(--ink)}
  .recorte-list{list-style:none}
  .foot{color:var(--muted);font-size:13px;padding:26px 0 60px;border-top:1px solid var(--line);margin-top:24px}
  .foot a{color:var(--amber);text-decoration:none}

  noscript .ns{display:block}
  .ns{padding:40px 0}
  .ns table{width:100%;border-collapse:collapse;margin-bottom:24px;background:var(--panel);border:1px solid var(--line)}
  .ns th,.ns td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .ns caption{text-align:left;font-family:var(--cond);text-transform:uppercase;font-size:22px;margin-bottom:8px;caption-side:top}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .frame .f1,.pframe .f1{animation:none;opacity:1;position:relative;display:none}
  }
  @media (max-width:560px){
    .params div{flex-basis:50%;border-bottom:1px solid var(--line)}
    .phase{grid-template-columns:38px 1fr}
  }
</style>
</head>
<body>
  <div class="top"><div class="wrap">
    <span class="brand">Rutina <b>Fuerza</b> v2</span>
    <nav class="nav">
      <a href="#pull">PULL</a><a href="#push">PUSH</a><a href="#legs">LEGS</a><a href="#opcional">4º DÍA</a>
      <a href="#fase2">FASE 2</a><a href="#road-dominadas">DOMINADAS</a><a href="#road-fondos">FONDOS</a>
    </nav>
  </div></div>

  <div class="wrap">
    <div id="app">
      <noscript>
        <div class="ns" id="noscript-fallback"><p>Esta es la versión estática (sin JavaScript) de la fase activa por defecto — <b>Fase 1 · Empujar</b>, bloque de accesorios A. Actívalo con JS para cambiar de fase o de bloque, ver variantes alternativas y las secciones de reglas. El detalle completo está en <a href="docs/plan-v2.md">docs/plan-v2.md</a>.</p><table><caption>PULL · Tirón — espalda · bíceps · trapecio — Martes 6:30</caption><thead><tr><th>Ejercicio</th><th>Prescripción</th></tr></thead><tbody><tr><td>Peso muerto con trap bar (asas bajas) ★</td><td>4 × 4-6 · RPE 7 · descanso 3-5 min</td></tr><tr><td>Dominadas lastradas</td><td>4 × 5-8 · RPE 8-9</td></tr><tr><td>Remo con barra (Pendlay)</td><td>3 × 6-8 · RPE 8</td></tr><tr><td>Remo en polea sentado</td><td>3 × 8-12 · RPE 9</td></tr><tr><td>Face pull / posterior en polea</td><td>3 × 15-20 · RPE 8</td></tr><tr><td>Curl con barra EZ</td><td>3 × 6-10 · RPE 9</td></tr><tr><td>Curl inclinado con mancuernas</td><td>2-3 × 10-12 · RPE 9-10</td></tr></tbody></table><table><caption>PUSH · Empuje — pecho · hombro · tríceps — Lunes 6:30</caption><thead><tr><th>Ejercicio</th><th>Prescripción</th></tr></thead><tbody><tr><td>Press banca plano con barra ★</td><td>4 × 4-6 · RPE 7 · descanso 3-5 min</td></tr><tr><td>Press militar de pie con barra ★</td><td>4 × 5-8 · RPE 7</td></tr><tr><td>Press inclinado con mancuernas</td><td>3 × 8-10 · RPE 9</td></tr><tr><td>Fondos en paralelas (lastre)</td><td>3 × 8-12 · RPE 9</td></tr><tr><td>Elevaciones laterales</td><td>3 × 15-20 · RPE 9-10</td></tr><tr><td>Extensión de tríceps sobre la cabeza</td><td>3 × 8-12 · RPE 9</td></tr></tbody></table><table><caption>LEGS · Pierna — cuádriceps · femoral · glúteo · gemelo — Jueves 6:30</caption><thead><tr><th>Ejercicio</th><th>Prescripción</th></tr></thead><tbody><tr><td>Sentadilla libre con barra ★</td><td>4 × 4-6 · RPE 7 · descanso 3-5 min</td></tr><tr><td>Peso muerto rumano (RDL)</td><td>3 × 8-10 · RPE 7</td></tr><tr><td>Hack squat</td><td>3 × 8-12 · RPE 9</td></tr><tr><td>Curl femoral sentado</td><td>3 × 10-15 · RPE 9-10</td></tr><tr><td>Extensiones de cuádriceps</td><td>3 × 12-15 · RPE 10</td></tr><tr><td>Gemelo de pie</td><td>4 × 8-12 · RPE 9</td></tr></tbody></table><table><caption>OPCIONAL · 4º día — accesorio / bombeo · RPE 7-8, sin fallo pesado — Sábado 8:30</caption><thead><tr><th>Ejercicio</th><th>Prescripción</th></tr></thead><tbody><tr><td>Elevaciones laterales</td><td>4 × 15-20</td></tr><tr><td>Pájaros en polea cruzada</td><td>3 × 15-20</td></tr><tr><td>Curl de bíceps (martillo)</td><td>3 × 12-15</td></tr><tr><td>Extensión de tríceps en polea</td><td>3 × 12-15</td></tr><tr><td>Gemelo sentado / sóleo</td><td>3 × 15-20</td></tr><tr><td>Core — rueda abdominal</td><td>3 × 8-12</td></tr></tbody></table>
</div>
      </noscript>
    </div>
  </div>

  <script type="module" src="data/app.js"></script>
</body>
</html>
